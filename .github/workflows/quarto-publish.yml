name: Render and Publish Quarto Book

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.4.549'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true

      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::knitr
            any::rmarkdown
            any::bookdown
            any::tidyverse
            any::dplyr
            any::ggplot2
            any::broom
            any::AER
            any::plm
            any::fixest
            any::lfe
            any::wooldridge
            any::stargazer
            any::huxtable
            any::modelsummary
            any::lmtest
            any::car

      - name: Install additional R packages
        run: |
          install.packages(c(
            "pglm", "splm", "pder", "lme4", "pmdplyr", "collapse",
            "ggpubr", "ggfortify", "plot3D", "scales", "estimatr",
            "dynlm", "fUnitRoots", "urca", "forecast", "astsa",
            "eurostat", "nnet", "survival", "sampleSelection", "censReg",
            "MCMCpack", "texreg", "kableExtra", "summarytools",
            "MASS", "mvtnorm", "quantreg", "Hmisc", "psych",
            "mice", "VIM", "OutliersO3", "robustbase",
            "modelr", "tidymodels", "margins", "prediction",
            "PoEdata", "skimr", "stringr"
          ), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Upload artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4
