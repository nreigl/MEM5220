name: Lint Code

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install lintr
        run: |
          install.packages("lintr")
        shell: Rscript {0}

      - name: Lint R files
        run: |
          results <- lintr::lint_dir(pattern = "\\.R(md)?$")
          print(results)
          # Fail if there are any errors (not warnings)
          errors <- results[sapply(results, function(x) x$type == "error")]
          if (length(errors) > 0) {
            quit(status = 1)
          }
        shell: Rscript {0}
